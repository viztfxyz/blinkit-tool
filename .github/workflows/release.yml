name: Release

# On every push to main, release-please keeps a "Release PR" open with the next version and changelog
# (from Conventional Commit messages). Merging that PR tags the release, creates the GitHub release,
# and publishes to npm here via trusted publishing (no npm token stored).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm 11.5.1+ (needed for trusted publishing)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
